name: Docs validate

# Cheap, fast checks that keep the documentation system itself healthy -
# catches "forgot to update the map" and "left a placeholder" mistakes
# before they land, per CONTRIBUTING.md's documentation-first rule.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: docs-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No placeholder documentation
        run: |
          if grep -rlEi '\b(TBD|TODO: fill|lorem ipsum|placeholder text)\b' docs/ --include='*.md'; then
            echo "::error::Placeholder documentation found - see CONTRIBUTING.md."
            exit 1
          fi

      - name: No new top-level docs/ folder without a matching README
        run: |
          for d in docs/*/; do
            if [ ! -f "${d}README.md" ]; then
              echo "::error::${d} has no README.md stating its purpose."
              exit 1
            fi
          done

      - name: Every ADR is indexed in memory/decisions.md or docs/adr/README.md
        run: |
          missing=0
          for f in docs/adr/ADR-*.md; do
            base="$(basename "$f")"
            if ! grep -q "$base" docs/adr/README.md .ai/memory/decisions.md 2>/dev/null; then
              echo "::error::$base is not referenced from docs/adr/README.md or .ai/memory/decisions.md"
              missing=1
            fi
          done
          exit $missing
