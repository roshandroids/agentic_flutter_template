name: Release

# Tag: rebuild web → GitHub Release → Pages (same run).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: roshandroids/platform-ci/.github/workflows/build.yml@v1
    with:
      config-path: ci.yaml
      trigger: release
      sha: ${{ github.sha }}

  release:
    needs: build
    uses: roshandroids/platform-ci/.github/workflows/release.yml@v1
    with:
      config-path: ci.yaml
      tag: ${{ github.ref_name }}
      artifact-sha: ${{ github.sha }}
    permissions:
      contents: write

  pages:
    needs: build
    uses: roshandroids/platform-ci/.github/workflows/deploy-pages.yml@v1
    with:
      config-path: ci.yaml
      artifact-sha: ${{ github.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
