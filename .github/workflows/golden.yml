name: Golden tests

# Golden (pixel/screenshot) tests are notoriously font/platform sensitive -
# see .ai/memory/gotchas.md. They run in their own job, pinned to the same
# Linux runner every time, so "passes locally, fails in CI" is caught here
# instead of blocking the general test job with flaky-looking failures.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: golden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    name: Golden (screenshot) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub global activate melos
      - run: dart pub global run melos bootstrap

      - name: Run golden-tagged tests
        run: dart pub global run melos exec --dir-exists=test --flutter -- flutter test --tags=golden

      - name: Upload failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failure-diffs
          path: |
            **/test/**/failures/*.png
          retention-days: 14
