name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    uses: roshandroids/platform-ci/.github/workflows/build.yml@v1
    with:
      config-path: ci.yaml
      trigger: push
      sha: ${{ github.sha }}

  deploy:
    needs: build
    uses: roshandroids/platform-ci/.github/workflows/deploy-pages.yml@v1
    with:
      config-path: ci.yaml
      artifact-sha: ${{ github.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
