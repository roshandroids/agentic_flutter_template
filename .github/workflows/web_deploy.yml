name: Web deploy (GitHub Pages)

# Deploys apps/app's web build to GitHub Pages on every push to main.
# GitHub Pages is the default target because it needs zero secrets beyond
# the repo's own GITHUB_TOKEN - so this workflow works immediately after
# cloning the template, unlike a Firebase/Netlify/S3 target which would
# need credentials nobody has yet. Swap the last step for your real hosting
# target when you have one; see docs/operations/DEPLOYMENT.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: apps/app
        run: flutter pub get
      - working-directory: apps/app
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
