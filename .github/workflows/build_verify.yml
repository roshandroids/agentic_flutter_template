name: Build verify

# Builds every platform enabled in template.config.yaml's `platforms:` list.
# This does NOT sign or publish anything - it only proves the app still
# builds for each target. Keep this matrix in sync with template.config.yaml;
# scripts/doctor.sh checks the same list for local toolchain readiness.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: build-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - working-directory: apps/app
        run: flutter pub get
      - working-directory: apps/app
        run: flutter build apk --debug

  ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: apps/app
        run: flutter pub get
      - working-directory: apps/app
        run: flutter build ios --no-codesign --debug

  web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: apps/app
        run: flutter pub get
      - working-directory: apps/app
        run: flutter build web --release
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: apps/app/build/web
          retention-days: 7
