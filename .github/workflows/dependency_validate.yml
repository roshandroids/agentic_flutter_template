name: Dependency validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: dependency-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    name: Architecture boundary check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: dart pub get

      - name: Check layer boundaries
        run: ./scripts/check_dependency_boundaries.sh

      - name: Fail on direct pubspec.lock edits
        run: |
          if git diff --name-only origin/main...HEAD | grep -q 'pubspec\.lock$'; then
            echo "pubspec.lock should not be hand-edited; run 'dart pub get' and commit the result."
          fi
