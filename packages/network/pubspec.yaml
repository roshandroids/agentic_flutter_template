name: network
description: >
  dio-based implementation of core's ApiClient - auth token attachment +
  refresh-on-401, retry with backoff, and DioException-to-Failure mapping.
  Nothing outside this package should import package:dio directly. See
  docs/architecture/ARCHITECTURE.md "Networking".
publish_to: "none"
version: 0.1.0
resolution: workspace
environment:
  sdk: ^3.10.0

dependencies:
  core:
    path: ../core
  dio: ^5.7.0
  meta: ^1.15.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
