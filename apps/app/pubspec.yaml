name: app
description: >
  The product application. Feature-first Clean Architecture, Riverpod,
  go_router - see docs/architecture/ARCHITECTURE.md. The only demonstration
  feature is dashboard/; the repository itself is the template's deliverable.
publish_to: "none"
version: 1.0.0+1
resolution: workspace
environment:
  sdk: ^3.10.0
  flutter: ">=3.24.0"

dependencies:
  core:
    path: ../../packages/core
  design_system:
    path: ../../packages/design_system
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  intl: ^0.20.2
  local_storage:
    path: ../../packages/local_storage
  network:
    path: ../../packages/network

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
